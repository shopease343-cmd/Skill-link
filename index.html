<body>
<div id="app"></div><div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle">Action</h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
'use strict';
  const API_BASE ='https://skill-link-12.onrender.com/api';
const state={page:'home',role:null,user:null,token:localStorage.getItem('skilllink_token')||'',sidebar:false,filters:{}};
  async function api(path,opts={}){
  const h={
    'Content-Type':'application/json',
    ...(opts.headers||{})
  };

  if(state.token){
    h.Authorization='Bearer '+state.token;
  }

  const r=await fetch(API_BASE+path,{
    ...opts,
    headers:h,
    credentials:'include'
  });

  let d={};
  try{
    d=await r.json();
  }catch{}

  if(!r.ok){
    throw new Error(d.message||d.error||'Request failed');
  }

  return d;
  }
const packages=[['Aarambh','Digital Foundation','₹499','🌱','Computer Basics, Internet & Online Tools, Basic Design, Freelancing Introduction'],['Udaan','Creative + Content Skills','₹999','🚀','Video Editing, Graphic Design, Content Creation, Social Media Basics'],['Pragati','Marketing + Client Skills','₹1,999','📈','Digital Marketing, Client Handling, Meta Ads Basics, Personal Branding'],['Brahmastra','Advanced Digital Skills','₹3,999','⚔️','Web Development, Advanced Marketing, Automation Tools, E-commerce & Dropshipping'],['Shikhar','Leadership + Business','₹6,999','🏆','Business Strategy, Team Building, Personal Management, Leadership Mastery']];
const publicPages=['home','courses','package','projects','masterclass','about','contact','login','register'];
const navLabel={home:'Home',courses:'Courses',projects:'Projects',masterclass:'Masterclass',about:'About'};
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2800)}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function go(p,id){state.page=p;if(id)state.filters.id=id;render();window.scrollTo({top:0,behavior:'smooth'})}
function header(){return `<header class="topbar"><button class="mobile-menu" onclick="toggleSidebar()">☰</button><div class="brand"><div class="brandmark">S</div><div class="brandtext">SKILLLINK<small>LEARN | GROW | EARN</small></div></div><nav class="nav">${Object.entries(navLabel).map(([k,v])=>`<a onclick="go('${k}')">${v}</a>`).join('')}<a onclick="go('contact')">Contact</a></nav><div class="top-actions"><button class="btn btn-outline btn-sm" onclick="go('login')">Login</button><button class="btn btn-primary btn-sm" onclick="go('register')">Get Started</button></div></header>`}
function footer(){return `<footer class="footer"><div class="footer-inner"><div><div class="brand"><div class="brandmark">S</div><div class="brandtext">SKILLLINK<small>LEARN | GROW | EARN</small></div></div><p>SkillLink connects digital learning, practical projects and opportunities for a brighter future.</p></div><div><b>Quick Links</b><a onclick="go('home')">Home</a><a onclick="go('courses')">Courses</a><a onclick="go('projects')">Projects</a><a onclick="go('masterclass')">Masterclass</a><a onclick="go('about')">About Us</a></div><div><b>Our Packages</b>${packages.map(p=>`<a onclick="go('package','${p[0]}')">${p[0]}</a>`).join('')}</div><div><b>Support</b><a>Help Center</a><a>Privacy Policy</a><a>Terms & Conditions</a><a>Refund Policy</a><a>FAQ</a></div></div><div class="container" style="padding-bottom:0;color:#8197b1;font-size:11px">© 2026 SkillLink. All rights reserved.</div></footer>`}
function home(){return `${header()}<section class="hero"><div class="hero-inner"><div class="eyebrow">Learn • Build • Earn</div><h1>Your Skills<br>Can Take You <span>Places</span></h1><p>SkillLink connects digital learning, practical projects, skills and opportunities in one platform.</p><div class="hero-actions"><button class="btn btn-primary" onclick="go('register')">Get Started</button><button class="btn btn-outline" onclick="go('courses')">Explore Courses</button></div><div class="stats"><div class="stat"><b>5+</b><span>Packages</span></div><div class="stat"><b>32+</b><span>Courses</span></div><div class="stat"><b>24+</b><span>Live Projects</span></div><div class="stat"><b>8+</b><span>Masterclasses</span></div><div class="stat"><b>1000+</b><span>Partners</span></div></div></div></section><div class="container"><div class="grid4"><div class="card"><b>🧠 Learn Skills</b><p class="muted">Practical courses from beginner to advanced.</p></div><div class="card"><b>🛠 Complete Projects</b><p class="muted">Build real client-ready experience.</p></div><div class="card"><b>💼 Earn Opportunities</b><p class="muted">Work with clients and grow earnings.</p></div><div class="card"><b>🤝 Grow With Community</b><p class="muted">Masterclasses, referrals and support.</p></div></div><div class="section-title" style="margin-top:35px"><div><h2>Popular Packages</h2><p>Choose a package and start learning today.</p></div><button class="btn btn-soft btn-sm" onclick="go('courses')">View All</button></div><div class="grid5">${packages.map(pkgCard).join('')}</div><div class="section-title" style="margin-top:35px"><div><h2>Latest Projects</h2><p>Work, learn and earn through real projects.</p></div><button class="btn btn-soft btn-sm" onclick="go('projects')">View All</button></div><div class="grid4">${projectCards().join('')}</div></div>${footer()}`}
function pkgCard(p){return `<div class="card package"><div class="pkg-img">${p[3]}</div><h3>${p[0]}</h3><div class="muted">${p[1]}</div><div class="price">${p[2]}</div><button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px" onclick="go('package','${p[0]}')">View Details</button></div>`}
function courses(){return `${header()}<div class="container"><div class="section-title"><div><h2>Explore Our Courses</h2><p>Choose a package and start learning today.</p></div></div><div class="tabs"><button class="tab active">All</button><button class="tab">Digital Skills</button><button class="tab">Marketing</button><button class="tab">Content Creation</button><button class="tab">Business</button></div><div class="list">${packages.map((p,i)=>`<div class="card"><div style="display:flex;gap:18px;align-items:center"><div class="pkg-img" style="width:100px;height:100px;border-radius:12px">${p[3]}</div><div style="flex:1"><h3>${p[0]}</h3><div class="muted">${p[1]}</div><div class="price">${p[2]}</div><p class="muted">• ${p[4].replaceAll(', ','<br>• ')}</p></div><button class="btn btn-primary btn-sm" onclick="go('package','${p[0]}')">View Courses</button></div></div>`).join('')}</div></div>${footer()}`}
function packageDetail(){const p=packages.find(x=>x[0]===state.filters.id)||packages[0];const lessons=p[0]==='Aarambh'?['Introduction to Computer','Operating System','File Management','What is Internet','Google Chrome','Useful Online Tools']:['Module 1','Module 2','Module 3','Module 4','Final Assessment'];return `${header()}<div class="container"><div class="muted">Home › Courses › ${p[0]}</div><div class="detail-hero" style="margin-top:18px"><div class="card"><div style="display:flex;justify-content:space-between;gap:15px"><div><h1>${p[3]} ${p[0]}</h1><div class="muted">${p[1]}</div><div class="price" style="margin-top:8px">${p[2]}</div></div><button class="btn btn-primary" onclick="purchase('${p[0]}')">Buy Now</button></div><div class="tabs"><span class="pill blue">12+ Lessons</span><span class="pill green">Lifetime Access</span><span class="pill">Certificate</span><span class="pill">Project Based</span><span class="pill">Community Support</span></div><h3>What You Will Learn</h3><div class="grid2">${p[4].split(', ').map(x=>`<div>✅ ${x}</div>`).join('')}</div></div><div class="media">${p[3]}</div></div><div class="card" style="margin-top:20px"><div class="tabs"><button class="tab active">Overview</button><button class="tab">Courses</button><button class="tab">Reviews</button></div><h3>Courses in This Package</h3><div class="list">${lessons.map((x,i)=>`<div class="list-row"><b>${i+1}.</b><div class="grow"><b>${x}</b><div class="muted">Video lesson • Notes • Quiz</div></div><span class="pill">${10+i}:20</span></div>`).join('')}</div></div></div>${footer()}`}
function projects(){return `${header()}<div class="container"><div class="section-title"><div><h2>Find Real Projects</h2><p>Work, Learn and Earn</p></div></div><div class="searchbar"><input placeholder="Search projects, skills..." oninput="filterProject(this.value)"><button class="btn btn-primary btn-sm">Search</button></div><div class="tabs"><button class="tab active">All</button><button class="tab">Web Development</button><button class="tab">Design</button><button class="tab">Marketing</button><button class="tab">Video Editing</button></div><div id="projectGrid" class="grid3">${projectCards().join('')}</div></div>${footer()}`}

function learningPartner(){return `<div class="card"><h2>My Learning</h2><p class="muted">Complete course → quiz → assessment → skill mastery → certificate.</p>${packages.map((p,i)=>`<div class="list-row"><span style="font-size:25px">${p[3]}</span><div class="grow"><b>${p[0]}</b><div class="muted">${i<2?8+i*2:0}/${i<2?12+i*3:15} lessons completed</div><div style="height:6px;background:#e7eef6;border-radius:8px;margin-top:6px"><div style="width:${i<2?65-i*15:0}%;height:100%;background:#1688ff;border-radius:8px"></div></div></div><button class="btn btn-primary btn-sm" onclick="go('package','${p[0]}')">Continue</button></div>`).join('')}</div>`}
function myProjects(){return `<div class="card"><div class="section-title"><div><h2>My Projects</h2><p>Assigned projects, submissions, revisions and status.</p></div><button class="btn btn-primary" onclick="createProject()">+ ${state.role==='CLIENT'?'Post Project':'View Projects'}</button></div>${['Website Development','Social Media Management','Logo Design','Product Video Editing'].map((x,i)=>`<div class="list-row"><div class="grow"><b>${x}</b><div class="muted">Budget ₹${[5000,3500,2000,4000][i]} • Deadline ${25+i} Oct 2026</div></div><span class="pill ${i===2?'green':'blue'}">${['In Progress','Assigned','Completed','Client Review'][i]}</span><button class="btn btn-soft btn-sm" onclick="openProject('${x}','₹${[5000,3500,2000,4000][i]}')">Details</button></div>`).join('')}</div>`}
function earningsPartner(){return `<div class="grid3"><div class="card"><h3>Total Earnings</h3><div class="price">₹8,450</div></div><div class="card"><h3>Available Balance</h3><div class="price">₹2,350</div><button class="btn btn-primary btn-sm" onclick="withdraw()">Request Withdrawal</button></div><div class="card"><h3>Pending Earnings</h3><div class="price">₹850</div></div></div><div class="card" style="margin-top:15px"><h3>Earnings Ledger</h3>${['Referral • Aarambh','Project • Website Design','Referral • Udaan','Project • Logo Design'].map((x,i)=>`<div class="list-row"><div class="grow"><b>${x}</b><div class="muted">${25-i} Sep 2026</div></div><b>+₹${[100,4000,250,2000][i]}</b></div>`).join('')}</div>`}
function myLeads(){return `<div class="card"><h2>My Leads</h2>${['Amit Sharma','Neha Jain','Rohit Singh'].map((x,i)=>`<div class="list-row"><div class="grow"><b>${x}</b><div class="muted">98XXXXXX${10+i} • Assigned ${24-i} Sep</div></div><select onchange="leadStatus(this.value)"><option>New</option><option>Contacted</option><option>Follow-up</option><option>Converted</option><option>Closed</option><option>Lost</option></select></div>`).join('')}</div>`}
function leaderboard(){return `<div class="card"><h2>Partner Leaderboard</h2><p class="muted">Score, level and progress. Private financial information is not exposed.</p><table class="table"><thead><tr><th>Rank</th><th>Partner</th><th>Score</th><th>Level</th><th>Progress</th></tr></thead><tbody>${[['Rahul Kumar',850,'L6'],['Priya Sharma',720,'L5'],['Aman Singh',650,'L5'],['Neha Verma',500,'L4']].map((x,i)=>`<tr><td>#${i+1}</td><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><span class="pill blue">Progress</span></td></tr>`).join('')}</tbody></table></div>`}
function profileAdmin(){return `<div class="grid2"><div class="card"><h2>Profile & Security</h2><form class="form" onsubmit="profileSave(event)"><input value="${esc(state.user?.name||'User')}" name="name" placeholder="Name"><input value="${esc(state.user?.email||'')}" name="email" placeholder="Email"><button class="btn btn-primary">Save Profile</button></form></div><div class="card"><h2>Change Password</h2><form class="form" onsubmit="changePassword(event)"><input name="old" type="password" placeholder="Current password" required><input name="new" type="password" placeholder="New password" required><input name="confirm" type="password" placeholder="Confirm password" required><button class="btn btn-primary">Change Password</button></form></div></div>`}
function messages(){return `<div class="card"><h2>Project Communication</h2><div class="list" style="height:380px;overflow:auto"><div class="list-row"><div class="grow"><b>Rahul Kumar</b><p class="muted">I have submitted the first version for client review.</p></div><span class="muted">10:30 AM</span></div><div class="list-row"><div class="grow"><b>You</b><p class="muted">Please include the requested revision.</p></div><span class="muted">11:15 AM</span></div></div><form class="form" style="margin-top:12px" onsubmit="sendMessage(event)"><textarea name="message" placeholder="Write a message..." required></textarea><button class="btn btn-primary">Send Message</button></form></div>`}
function reviews(){return `<div class="card"><h2>Reviews & Ratings</h2>${['Rahul Kumar','Priya Sharma','Aman Singh'].map((x,i)=>`<div class="list-row"><div class="grow"><b>${x}</b><div class="muted">${['Website Development','Logo Design','Social Media'][i]}</div></div><b>⭐ ${[4.8,4.7,4.6][i]}</b></div>`).join('')}</div>`}
function quickAction(){if(state.role==='CLIENT')createProject();else if(state.role==='CEO'||state.role==='ADMIN')createUser();else withdraw()}async function loginSubmit(e){e.preventDefault();const f=new FormData(e.target);try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({identifier:f.get('identifier'),password:f.get('password'),referral:f.get('referral')})});state.token=d.token;state.role=d.user.role;state.user=d.user;localStorage.setItem('skilllink_token',state.token);toast('Login successful');renderDashboard()}catch(err){toast(err.message)}}
async function loginSubmit(e){
  e.preventDefault();

  const f = new FormData(e.target);

  try {
    const d = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        username: f.get('identifier'),
        password: f.get('password')
      })
    });

    state.token = d.token;
    state.role = d.user.role;
    state.user = d.user;

    localStorage.setItem('skilllink_token', state.token);

    toast('Login successful');
    renderDashboard();

  } catch (err) {
    toast(err.message);
  }
  }
async function registerSubmit(e){e.preventDefault();const f=new FormData(e.target);if(f.get('password')!==f.get('confirm'))return toast('Passwords do not match');try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:f.get('name'),email:f.get('email'),mobile:f.get('mobile'),password:f.get('password'),referral:f.get('referral')})});state.token=d.token;state.role=d.user.role;state.user=d.user;localStorage.setItem('skilllink_token',state.token);toast('Account created');renderDashboard()}catch(err){toast(err.message)}}
async function logout(){try{await api('/auth/logout',{method:'POST'})}catch{}state.token='';state.role=null;state.user=null;localStorage.removeItem('skilllink_token');go('home')}
async function renderDashboard(){try{const d=await api('/auth/me');state.role=d.user.role;state.user=d.user;render()}catch{state.token='';localStorage.removeItem('skilllink_token');go('login')}}
async function saveUser(e){e.preventDefault();const f=new FormData(e.target);try{await api('/users',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});closeModal();toast('User created and audit logged');dashPage('All Users')}catch(err){toast(err.message)}}
async function purchase(pkg){if(!state.token)return go('login');openModal('Package Purchase — '+pkg,`<form class="form" onsubmit="submitPurchase(event,'${pkg}')"><p class="muted">Payment is manual through the Company QR.</p><div class="card"><b>Company QR</b><div style="font-size:65px;text-align:center">▦</div><div style="text-align:center">UPI ID: skilllink@upi</div></div><input name="amount" placeholder="Amount" required><input name="reference" placeholder="Transaction / UTR ID" required><input name="screenshot" type="file" accept="image/*" required><button class="btn btn-primary">Submit Payment for Verification</button></form>`)}
async function submitPurchase(e,pkg){e.preventDefault();const f=new FormData(e.target);try{await api('/purchases',{method:'POST',body:JSON.stringify({package:pkg,amount:f.get('amount'),reference:f.get('reference')})});closeModal();toast('Payment submitted for CEO verification')}catch(err){toast(err.message)}}
function openProject(title,budget){openModal(title,`<p>${esc(title)} project workflow</p><div class="grid2"><div><b>Budget</b><p>${esc(budget)}</p></div><div><b>Status</b><p><span class="pill blue">Available</span></p></div></div><p class="muted">Required skills: HTML, CSS, JavaScript, communication.</p><div class="tabs"><button class="tab active">Overview</button><button class="tab">Messages</button><button class="tab">Revisions</button><button class="tab">Dispute</button></div><button class="btn btn-primary" onclick="expressInterest('${title}')">${state.role==='PARTNER'?'Express Interest':'Manage Project'}</button>`)}
async function expressInterest(title){try{await api('/projects/interest',{method:'POST',body:JSON.stringify({title})});closeModal();toast('Interest submitted for assignment')}catch(e){toast(e.message)}}
function createProject(){openModal('Create Project',`<form class="form" onsubmit="saveProject(event)"><input name="title" placeholder="Project Title" required><textarea name="description" placeholder="Description" required></textarea><input name="skills" placeholder="Required skills" required><input name="budget" type="number" placeholder="Budget" required><input name="deadline" type="date" required><select name="priority"><option>Normal</option><option>High</option></select><button class="btn btn-primary">Create Project</button></form>`)}
async function saveProject(e){e.preventDefault();const f=new FormData(e.target);try{await api('/projects',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});closeModal();toast('Project created');dashPage('Projects')}catch(err){toast(err.message)}}
function withdraw(){openModal('Request Withdrawal',`<form class="form" onsubmit="saveWithdrawal(event)"><p class="muted">Minimum withdrawal: ₹100. Available balance is checked server-side.</p><input name="amount" type="number" min="100" placeholder="Amount" required><input name="upi" placeholder="UPI ID" required><button class="btn btn-primary">Submit Withdrawal</button></form>`)}
async function saveWithdrawal(e){e.preventDefault();const f=new FormData(e.target);try{await api('/withdrawals',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});closeModal();toast('Withdrawal request sent to CEO')}catch(err){toast(err.message)}}
async function verifyPayment(u){try{await api('/payments/verify',{method:'POST',body:JSON.stringify({user:u})});toast('Payment status updated')}catch(e){toast(e.message)}}
async function approveWithdrawal(u){try{await api('/withdrawals/approve',{method:'POST',body:JSON.stringify({partnerId:u})});toast('Withdrawal approved')}catch(e){toast(e.message)}}
function createPackage(){openModal('Add Package',`<form class="form"><input placeholder="Package name"><input placeholder="Description"><input placeholder="Price"><button class="btn btn-primary" onclick="event.preventDefault();closeModal();toast('Package save requires API configuration')">Save Package</button></form>`)}
function editPackage(n){openModal('Edit '+n,`<form class="form"><input value="${n}" placeholder="Package"><input placeholder="Description"><input value="${packages.find(p=>p[0]===n)?.[2]||''}" placeholder="Price"><input placeholder="Thumbnail URL"><button class="btn btn-primary" onclick="event.preventDefault();closeModal();toast('Edit request queued')">Save Changes</button></form>`)}
function createCourse(){openModal('Create Course',`<form class="form"><input placeholder="Course Name"><input placeholder="Description"><select>${packages.map(p=>`<option>${p[0]}</option>`).join('')}</select><input placeholder="Video URL / Embed"><input placeholder="Notes/PDF URL"><button class="btn btn-primary" onclick="event.preventDefault();closeModal();toast('Course creation requires API save')">Create Course</button></form>`)}
function createMaster(){openModal('Create Masterclass',`<form class="form" onsubmit="event.preventDefault();closeModal();toast('Masterclass draft saved');"><input placeholder="Title" required><textarea placeholder="Description" required></textarea><input type="datetime-local" required><input placeholder="Meeting link" required><select><option>Paid</option><option>Free</option></select><button class="btn btn-primary">Publish Masterclass</button></form>`)}
function editMaster(n){openModal('Edit Masterclass',`<form class="form"><input value="${esc(n)}"><input type="datetime-local"><input placeholder="New meeting link"><button class="btn btn-primary" onclick="event.preventDefault();closeModal();toast('Masterclass updated')">Save</button></form>`)}
function createLead(){openModal('Add Lead',`<form class="form"><input placeholder="Name"><input placeholder="Mobile"><input placeholder="Source"><select><option>Assign Partner</option><option>PRT245</option><option>PRT246</option></select><button class="btn btn-primary" onclick="event.preventDefault();closeModal();toast('Lead created')">Create Lead</button></form>`)}
function editLevel(l){openModal('Level L'+l,`<form class="form"><input value="${[100,250,400,500,650,800,1000,1500,2000][l-1]||0}" placeholder="Score requirement"><input placeholder="Valid referral requirement"><input placeholder="Skill mastery requirement"><input placeholder="Reward description"><button class="btn btn-primary" onclick="event.preventDefault();closeModal();toast('Level configuration saved')">Save Level</button></form>`)}
function createNotification(){openModal('Create Notification',`<form class="form"><input placeholder="Title"><textarea placeholder="Description"></textarea><input type="date"><select><option>All Partners</option><option>All Clients</option><option>All Admins</option></select><button class="btn btn-primary" onclick="event.preventDefault();closeModal();toast('Notification published')">Send Notification</button></form>`)}
function replaceQR(){openModal('Replace Company QR',`<form class="form"><input type="file" accept="image/*" required><input placeholder="UPI ID" value="skilllink@upi"><label><input type="checkbox" checked> Active</label><button class="btn btn-primary" onclick="event.preventDefault();closeModal();toast('QR replacement saved')">Save QR</button></form>`)}
function registerMaster(n){if(!state.token)return go('login');toast('Masterclass registration submitted')}
function sendContact(e){e.preventDefault();toast('Message submitted to support')}
function forgotPassword(){openModal('Forgot Password',`<form class="form" onsubmit="event.preventDefault();closeModal();toast('If the account exists, reset instructions will be sent')"><input type="email" placeholder="Account email" required><button class="btn btn-primary">Send Reset Instructions</button></form>`)}
function profileSave(e){e.preventDefault();toast('Profile update submitted')}
function changePassword(e){e.preventDefault();toast('Password change request submitted')}
function sendMessage(e){e.preventDefault();toast('Message sent')}
function leadStatus(v){toast('Lead status updated to '+v)}
function filterProject(v){document.querySelectorAll('#projectGrid .project-card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(v.toLowerCase())?'block':'none')}
function toggleSidebar(){state.sidebar=!state.sidebar;document.querySelector('.sidebar')?.classList.toggle('open',state.sidebar)}
function render(){const root=document.getElementById('app');if(state.role){root.innerHTML=shell();return}if(state.page==='home')root.innerHTML=home();else if(state.page==='courses')root.innerHTML=courses();else if(state.page==='package')root.innerHTML=packageDetail();else if(state.page==='projects')root.innerHTML=projects();else if(state.page==='masterclass')root.innerHTML=masterclass();else if(state.page==='about')root.innerHTML=about();else if(state.page==='contact')root.innerHTML=contact();else if(state.page==='login')root.innerHTML=login();else if(state.page==='register')root.innerHTML=register();}
if(state.token)renderDashboard();else render();
</script>
</body></html>
