const API_BASE_URL="https://skill-link-12.onrender.com/api";
function readCookie(name){const p=document.cookie.split("; ").find(x=>x.startsWith(name+"="));return p?decodeURIComponent(p.slice(name.length+1)):""}
async function ensureCsrf(){
  if(readCookie("sl_csrf")) return;
  let res;
  try{res=await fetch(`${API_BASE_URL}/auth/csrf`,{credentials:"include",mode:"cors"})}
  catch(e){throw new Error("Cannot connect to SkillLink backend. Check Render and CORS settings.")}
  if(!res.ok) throw new Error(`Backend connection failed (${res.status}). Check Render APP_ORIGIN/CORS settings.`);
}
async function api(path,options={}){
  await ensureCsrf();
  const csrf=readCookie("sl_csrf");
  const opts={credentials:"include",mode:"cors",headers:{"Content-Type":"application/json","X-CSRF-Token":csrf,...(options.headers||{})},...options};
  let res;
  try{res=await fetch(`${API_BASE_URL}${path}`,opts)}catch(e){throw new Error("Cannot connect to SkillLink backend. Check Render and CORS settings.")}
  let data={};try{data=await res.json()}catch{}
  if(!res.ok) throw new Error(data.error||`Request failed (${res.status})`);
  return data;
}
async function submitLogin(form){
const fd=new FormData(form);try{
await api("/api/auth/login",{method:"POST",body:JSON.stringify(Object.fromEntries(fd.entries()))});
const me=await api("/api/auth/me");go("app",me.user.role);
}catch(e){showModal("Login failed",e.message)}
}
async function submitRegister(form){
const fd=new FormData(form);try{
await api("/api/auth/register",{method:"POST",body:JSON.stringify(Object.fromEntries(fd.entries()))});
showModal("Registration submitted","Your account has been created. Use the secure login flow after activation.");go("login");
}catch(e){showModal("Registration failed",e.message)}
}
async function logout(){try{await api("/api/auth/logout",{method:"POST",body:"{}"})}catch{}go("home")}
function appPage(role){return privateShell(role,"dashboard")}
function dashboardPage(active){api("/api/auth/me").then(x=>{document.getElementById("app").innerHTML=privateShell(x.user.role,active);window.scrollTo(0,0)}).catch(()=>go("login"))}
function bindForms(){
const l=document.getElementById("loginForm");if(l)l.addEventListener("submit",e=>{e.preventDefault();submitLogin(l)});
const r=document.getElementById("registerForm");if(r)r.addEventListener("submit",e=>{e.preventDefault();submitRegister(r)});
}

function closeModal(){document.getElementById("modal").classList.remove("open")}

function go(page,role){

document.getElementById("app").innerHTML=(p[page]||home)();window.scrollTo(0,0);bindForms();
}
